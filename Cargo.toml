[package]
name = "cairn"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4.3"
maud = { version = "0.27.0", features = ["axum"] }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
roxmltree = "0.21.2"
rquickjs = "0.14"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "sync"] }
utoipa = "6.0.0"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
