[package]
name = "cairn"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4.3"
pulldown-cmark = { version = "0.13", default-features = false }
roxmltree = "0.21.2"
rquickjs = "0.14"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3.27.0"
