name: CD # Continuous Deployment

on:
  push:
    tags:
      - '[v]?[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  publish:
    name: Publishing for ${{ matrix.job.os-name }}-${{ matrix.job.architecture }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - os: ubuntu-latest
            os-name: linux
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
          - os: macos-latest
            os-name: macos
            target: aarch64-apple-darwin
            architecture: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: jeffutter
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # Verify and push the Nix build to the cache first.
      - run: nix build --accept-flake-config
      - run: nix flake check --accept-flake-config

      # The release tarball is built with plain cargo so the binary links against
      # the runner's system libraries, not /nix/store. Pele and htmx are embedded
      # at compile time, so take their Nix-fetched paths from the dev shell.
      - name: Locate embedded assets
        run: |
          nix develop --accept-flake-config -c sh -c \
            'echo "PELE_JS=$PELE_JS"; echo "HTMX_JS=$HTMX_JS"' >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Cargo build
        run: cargo build --release --locked --target ${{ matrix.job.target }}

      - name: Packaging final binary
        shell: bash
        run: |
          cd target/${{ matrix.job.target }}/release
          strip cairn
          RELEASE_NAME=cairn-${GITHUB_REF#refs/tags/}-${{ matrix.job.os-name }}-${{ matrix.job.architecture }}
          tar czvf "$RELEASE_NAME.tar.gz" cairn
          shasum -a 256 "$RELEASE_NAME.tar.gz" > "$RELEASE_NAME.sha256"

      - name: Releasing assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/${{ matrix.job.target }}/release/cairn-*.tar.gz
            target/${{ matrix.job.target }}/release/cairn-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
